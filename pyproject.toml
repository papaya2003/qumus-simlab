[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qumus-simlab"
version = "0.1.0"
description = "Qumus simulated laboratory: the Hall-bar testbench served as three instrument-contract-v1 windows (exfoliation 8781, stacking 8782, vdW reactor 8783)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - Sanfeng Wu Lab, Princeton. Do not distribute." }
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pillow>=10.1",
    "numpy>=1.26",
    "shapely>=2.1,<3",
    "imageio-ffmpeg>=0.5",
    # v1 RGB recognition of the simulated micrographs (the Hall-bar bench needs it)
    "opencv-python-headless>=4.8",
    "scipy>=1.11",
    "scikit-image>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3", "httpx>=0.27", "ruff>=0.5"]
# Headless KLayout save/reopen of device designs (QUMUS_KLAYOUT_BACKEND=python).
design = ["klayout>=0.29"]

[project.scripts]
qumus-simlab = "qumus_simlab.cli:main"

[tool.setuptools.packages.find]
include = ["qumus_simlab*"]

[tool.setuptools.package-data]
"qumus_simlab" = ["config/*.yaml", "testbench/scenarios/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -m 'not slow'"
markers = ["slow: long end-to-end runs (minutes); run with `pytest -m slow`"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
